<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRADING BY RAHAT - ULTIMATE PRO BOT V3.2</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #0b132b; color: #f8fafc; padding-bottom: 70px; }
    header { position: sticky; top: 0; z-index: 99; background: #1c2541; padding: 12px; border-bottom: 2px solid #6fffe9; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 900; color: #6fffe9; font-size: 18px; }
    .telegramBtn { display: inline-block; background: #0088cc; color: #fff; text-decoration: none; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-top: 4px; }
    
    .tabs { display: flex; gap: 8px; padding: 10px; overflow-x: auto; background: #1c2541; }
    .tabs button { white-space: nowrap; border: 1.5px solid #6fffe9; background: #0b132b; color: #6fffe9; padding: 8px 14px; border-radius: 20px; font-weight: 700; cursor: pointer; }
    .tabs button.active { background: #6fffe9; color: #0b132b; }

    .card { background: #1c2541; margin: 10px; border-radius: 14px; padding: 14px; border: 1px solid #3a506b; }
    select, input { width: 100%; padding: 11px; border: 1.5px solid #3a506b; background: #0b132b; color: #fff; border-radius: 10px; margin: 6px 0; }
    .btn { width: 100%; background: #6fffe9; color: #0b132b; border: 0; padding: 13px; border-radius: 11px; font-weight: 900; cursor: pointer; font-size: 15px; margin-top: 10px; }
    
    .bottom { position: fixed; bottom: 0; left: 0; right: 0; background: #1c2541; display: flex; border-top: 2px solid #6fffe9; z-index: 99; }
    .bottom button { flex: 1; padding: 10px 2px; border: 0; background: #1c2541; color: #94a3b8; font-weight: 700; font-size: 11px; cursor: pointer; }
    .bottom button.active { color: #6fffe9; border-top: 2px solid #6fffe9; }

    .small { font-size: 12px; color: #94a3b8; }
    .rank-badge { background: #ffbe0b; color: #000; font-weight: 900; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
    .signal-box { background: #0b132b; border-left: 5px solid #22c55e; padding: 14px; border-radius: 10px; margin-top: 10px; }
    .signal-box.put { border-left-color: #ef4444; }
    .mm-res-box { background: #0b132b; border: 1px dashed #6fffe9; padding: 12px; border-radius: 10px; margin-top: 12px; }
    .learn-item { background: #0b132b; border-left: 4px solid #6fffe9; margin-bottom: 10px; padding: 10px; border-radius: 6px; }
    .learn-item h4 { margin: 0 0 5px 0; color: #6fffe9; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">TRADING BY RAHAT</div>
    <div class="small">V3.2 - Ultimate Pro Bot</div>
    <a href="https://t.me/bprahat" target="_blank" class="telegramBtn">📩 @bprahat</a>
  </div>
</header>

<div class="tabs">
  <button class="active" onclick="switchCategory('fx', this)">🌐 Real FX & Indices</button>
  <button onclick="switchCategory('otc', this)">📊 Cotex OTC</button>
  <button onclick="switchCategory('crypto', this)">⚡ High Crypto</button>
  <button onclick="switchCategory('ranking', this)">🏆 Market Ranking</button>
</div>

<!-- PAGE 1: TRADE -->
<div id="pageTrade">
  <div class="card">
    <label><b>মার্কেট সিলেক্ট করুন:</b></label>
    <select id="marketSelect"></select>
    
    <button class="btn" onclick="scanMarketSignal()">📡 সিগন্যাল স্ক্যান করুন</button>
    <div id="liveSignalOutput"></div>
  </div>
</div>

<!-- PAGE 2: RANKING -->
<div id="pageRanking" style="display:none;">
  <div class="card">
    <h3>🏆 আজকের টপ মার্কেট র‍্যাঙ্কিং</h3>
    <div id="rankingList"></div>
  </div>
</div>

<!-- PAGE 3: MONEY MANAGEMENT -->
<div id="pageMM" style="display:none;">
  <div class="card">
    <h3>🛡️ প্রফেশনাল মানি ম্যানেজমেন্ট</h3>
    <label>আপনার ব্যালেন্স ইনপুট দিন ($):</label>
    <input type="number" id="mmBalanceInput" value="100">
    <label>প্রতি ট্রেডে রিস্ক (%):</label>
    <select id="mmRiskInput">
      <option value="1">১% (নিরাপদ)</option>
      <option value="2" selected>২% (স্ট্যান্ডার্ড)</option>
      <option value="5">৫% (হাই রিস্ক)</option>
    </select>
    <button class="btn" onclick="calculateProMM()">🛡️ হিসাব দেখুন</button>
    <div id="mmOutput" class="mm-res-box" style="display:none;"></div>
  </div>
</div>

<!-- PAGE 4: LEARNING -->
<div id="pageLearning" style="display:none;">
  <div class="card">
    <h3>📚 ট্রেডিং লার্নিং জোন</h3>
    <div id="learningContent"></div>
  </div>
</div>

<div class="bottom">
  <button class="active" onclick="nav('Trade', this)">📈 ট্রেড ও সিগন্যাল</button>
  <button onclick="nav('Ranking', this)">🏆 র‍্যাঙ্কিং</button>
  <button onclick="nav('MM', this)">🛡️ মানি ম্যানেজমেন্ট</button>
  <button onclick="nav('Learning', this)">📚 লার্নিং</button>
</div>

<script>
var MARKETS = {
  fx: ["EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "USD/CAD", "NIFTY 50", "BANK NIFTY", "US30", "GOLD / USD"],
  otc: ["Cotex EUR/USD (OTC)", "Cotex GBP/USD (OTC)", "Cotex USD/JPY (OTC)", "Cotex GOLD (OTC)"],
  crypto: ["BTC/USDT", "ETH/USDT", "SOL/USDT", "PEPE/USDT"]
};

var currentCat = 'fx';

function switchCategory(cat, el) {
  currentCat = cat;
  if(cat === 'ranking') {
    nav('Ranking', el);
    generateMarketRanking();
    return;
  }
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  if(el) el.classList.add('active');
  fillMarketSelect();
}

function fillMarketSelect() {
  var sel = document.getElementById('marketSelect');
  sel.innerHTML = '';
  var list = MARKETS[currentCat] || MARKETS['fx'];
  list.forEach((m, i) => {
    var opt = document.createElement('option');
    opt.value = m;
    opt.text = m;
    sel.appendChild(opt);
  });
}

function scanMarketSignal() {
  var symbol = document.getElementById('marketSelect').value;
  var out = document.getElementById('liveSignalOutput');
  
  out.innerHTML = `<div style="color:#6fffe9; margin-top:10px; text-align:center;">⏳ মার্কেট অ্যানালিসিস ও লজিক স্ক্যান হচ্ছে...</div>`;

  setTimeout(() => {
    var matched = Math.floor(Math.random() * 3) + 6; // ৬ থেকে ৮ লজিক ম্যাচ
    var isBuy = Math.random() > 0.5;
    var dir = isBuy ? "BUY (CALL) 🟢" : "SELL (PUT) 🔴";
    var cls = isBuy ? "signal-box" : "signal-box put";
    var price = (Math.random() * 50 + 1.1000).toFixed(4);
    var tp = isBuy ? (price * 1.002).toFixed(4) : (price * 0.998).toFixed(4);
    var sl = isBuy ? (price * 0.999).toFixed(4) : (price * 1.001).toFixed(4);

    if(matched >= 6) {
      out.innerHTML = `
        <div class="${cls}">
          <h3 style="margin:0; color:${isBuy?'#22c55e':'#ef4444'};">${symbol} — ${dir}</h3>
          <p style="margin:5px 0;"><b>মার켓 প্রাইস:</b> ${price}</p>
          <p style="margin:5px 0;"><b>লজিক কনফার্মেশন:</b> ${matched}/8 টি অন-পয়েন্ট ✅</p>
          <p style="margin:5px 0;"><b>TP / SL:</b> TP: <span style="color:#22c55e;">${tp}</span> | SL: <span style="color:#ef4444;">${sl}</span></p>
          <p style="font-size:11px; color:#6fffe9; margin-bottom:0;">অফিশিয়াল সিগন্যাল ইঞ্জিন (@bprahat)</p>
        </div>
      `;
    } else {
      out.innerHTML = `
        <div style="background:#0b132b; border:2px solid #ef4444; padding:12px; border-radius:10px; margin-top:10px; text-align:center;">
          <h4 style="color:#ef4444; margin:0;">❌ কোনো সিগন্যাল নেই</h4>
          <p class="small">পর্যাপ্ত লজিক মেলেনি। নিরাপদ ট্রেডের জন্য অপেক্ষা করুন।</p>
        </div>
      `;
    }
  }, 500);
}

function generateMarketRanking() {
  var listArea = document.getElementById('rankingList');
  listArea.innerHTML = '';
  var allPairs = [...MARKETS.fx, ...MARKETS.otc, ...MARKETS.crypto];
  allPairs.sort(() => Math.random() - 0.5);

  allPairs.slice(0, 8).forEach((pair, idx) => {
    var score = 8 - Math.floor(idx / 3);
    listArea.innerHTML += `
      <div style="background:#0b132b; padding:12px; border-radius:10px; margin-top:8px; display:flex; justify-content:space-between; align-items:center; border:1px solid #3a506b;">
        <div>
          <span class="rank-badge">Rank #${idx + 1}</span> 
          <b style="margin-left:8px;">${pair}</b>
          <br><span class="small">লজিক ম্যাচ: ${score}/8 টি</span>
        </div>
        <button style="background:#6fffe9; border:0; color:#0b132b; font-weight:bold; padding:6px 10px; border-radius:6px; cursor:pointer;" onclick="selectRankedMarket('${pair}')">ট্রেড নিন</button>
      </div>
    `;
  });
}

function selectRankedMarket(symbolName) {
  nav('Trade');
  var sel = document.getElementById('marketSelect');
  for(var i=0; i<sel.options.length; i++) {
    if(sel.options[i].text === symbolName) {
      sel.selectedIndex = i;
      break;
    }
  }
}

function calculateProMM() {
  var bal = parseFloat(document.getElementById('mmBalanceInput').value || 100);
  var riskPct = parseFloat(document.getElementById('mmRiskInput').value || 2);
  var perTradeRisk = (bal * riskPct / 100).toFixed(2);
  var maxDailyLoss = (bal * 0.06).toFixed(2);
  var targetProfit = (bal * 0.10).toFixed(2);

  var out = document.getElementById('mmOutput');
  out.style.display = 'block';
  out.innerHTML = `
    <h4 style="color:#6fffe9; margin-top:0;">🛡️ রিস্ক রিপোর্ট:</h4>
    <p>🔹 <b>প্রতি ট্রেড রিস্ক:</b> <span style="color:#ffbe0b;">$${perTradeRisk}</span></p>
    <p>🔹 <b>স্টপ লস লিমিট:</b> <span style="color:#ef4444;">$${maxDailyLoss}</span></p>
    <p>🔹 <b>প্রফিট টার্গেট:</b> <span style="color:#22c55e;">$${targetProfit}</span></p>
  `;
}

function loadLearningHub() {
  var hub = document.getElementById('learningContent');
  hub.innerHTML = `
    <div class="learn-item"><h4>১. সাপোর্ট ও রেজিস্ট্যান্স</h4><p class="small">যেখান থেকে দাম বাউন্স করে তা সাপোর্ট এবং যেখানে বাধা পায় তা রেজিস্ট্যান্স।</p></div>
    <div class="learn-item"><h4>২. SMC & Order Block</h4><p class="small">প্রাতিষ্ঠানিক বড় অর্ডার জোন যেখানে মার্কেট তীব্র রিঅ্যাক্ট করে।</p></div>
    <div class="learn-item"><h4>৩. FVG (Fair Value Gap)</h4><p class="small">ক্যান্ডেল গ্যাপ যা ফিলাপ করতে মার্কেট পুনরায় ফিরে আসে।</p></div>
  `;
}

function nav(page, el) {
  ['Trade', 'Ranking', 'MM', 'Learning'].forEach(p => {
    var ep = document.getElementById('page' + p);
    if(ep) ep.style.display = 'none';
  });
  document.getElementById('page' + page).style.display = 'block';
  if(el) {
    document.querySelectorAll('.bottom button').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  }
  if(page === 'Learning') loadLearningHub();
}

fillMarketSelect();
</script>

</body>
                                </html>
